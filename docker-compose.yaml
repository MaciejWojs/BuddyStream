name: BuddyStream-initial-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:3000:3000
    environment:
      - NODE_ENV=development
      - PORT=3000
    networks:
      - buddystream-network
  db:
    image: postgres:18.6-alpine
    ports:
      - 127.0.0.1:5432:5432
    environment:
      - POSTGRES_USER=buddystream
      - POSTGRES_PASSWORD=buddystream
      - POSTGRES_DB=buddystream
    networks:
      - buddystream-network

networks:
  buddystream-network:
    driver: bridge
volumes:
  db_data:
    driver: local
