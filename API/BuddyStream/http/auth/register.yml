info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: http://{{BASE_URL}}/{{BASE_PATH}}/auth/register
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: "{\r

      \  \"username\": \"john_doe\",\r

      \  \"email\": \"john.doe@example.com\",\r

      \  \"password\": \"SecurePassword123#\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
