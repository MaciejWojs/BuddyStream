docs:
  content: |
    # Auth API

    Registration, login, the current user, and logout. Requests use `BASE_URL` and `BASE_PATH`.

    ```
    {{BASE_URL}}/{{BASE_PATH}}
    ```

    | Variable | Example | Description |
    |---|---|---|
    | `BASE_URL` | `localhost:3000` | Host and port |
    | `BASE_PATH` | `api/v1` | API prefix |

    Sessions travel in `HttpOnly` cookies. Login sets `accessToken` and `refreshToken`. `GET /auth/me` reads `accessToken`. `POST /auth/logout` reads `refreshToken` and clears both cookies.

    A broken domain rule returns:

    ```json
    { "code": "auth.invalid_credentials", "message": "Invalid credentials" }
    ```

    | Status | When |
    |---|---|
    | 401 | The caller is not allowed to finish the action |
    | 404 | The resource does not exist |
    | 409 | The operation conflicts with the current state |
    | 422 | The value breaks a domain rule |
    | 500 | `{ "message": "Internal Server Error" }` |

    ## Endpoints

    - [`POST /auth/register`](#post-authregister) — create an account
    - [`POST /auth/login`](#post-authlogin) — set the session cookies
    - [`GET /auth/me`](#get-authme) — read the signed-in user
    - [`POST /auth/logout`](#post-authlogout) — revoke the refresh token and clear the cookies

    ## Quick start

    ```bash
    # 1. Register. The body is only a confirmation message.
    curl -X POST "http://{{BASE_URL}}/{{BASE_PATH}}/auth/register" \
      -H "Content-Type: application/json" \
      -d '{"username":"jane_doe","email":"jane.doe@example.com","password":"SecurePassword123#"}'

    # 2. Login. Keep the Set-Cookie headers in a jar.
    curl -c cookies.txt -X POST "http://{{BASE_URL}}/{{BASE_PATH}}/auth/login" \
      -H "Content-Type: application/json" \
      -d '{"email":"jane.doe@example.com","password":"SecurePassword123#"}'

    # 3. Read the current user with the access cookie.
    curl -b cookies.txt "http://{{BASE_URL}}/{{BASE_PATH}}/auth/me"

    # 4. Log out. The refresh cookie is revoked and both cookies are cleared.
    curl -b cookies.txt -c cookies.txt -X POST "http://{{BASE_URL}}/{{BASE_PATH}}/auth/logout"
    ```

    ## POST /auth/register

    `POST {{BASE_URL}}/{{BASE_PATH}}/auth/register`

    | Field | Required | Rules | Example |
    |---|---|---|---|
    | `username` | yes | 3–database limit, no whitespace | `jane_doe` |
    | `email` | yes | email address | `jane.doe@example.com` |
    | `password` | yes | 14–64 characters, mixed case, a digit, a symbol, and enough strength | `SecurePassword123#` |

    **200 OK**

    ```json
    { "message": "User registered successfully" }
    ```

    **409 Conflict** — the email is already registered.

    ```json
    { "code": "user.already_exists", "message": "User already exists" }
    ```

    **422 Unprocessable Entity** — a domain rule rejected the value. `code` is one of `user.email.invalid`, `user.username.invalid`, `user.username.whitespace`, `user.password.invalid`, `user.password.too_weak`, `user.password.complexity`.

    ```json
    { "code": "user.password.too_weak", "message": "Password is not strong enough" }
    ```

    ## POST /auth/login

    `POST {{BASE_URL}}/{{BASE_PATH}}/auth/login`

    | Field | Required | Example |
    |---|---|---|
    | `email` | yes | `jane.doe@example.com` |
    | `password` | yes | `SecurePassword123#` |

    **200 OK** — body plus `Set-Cookie` for `accessToken` and `refreshToken` (`HttpOnly`, `Secure`, `SameSite=Lax`, `Path=/`).

    ```json
    { "message": "User logged in successfully" }
    ```

    **401 Unauthorized** — unknown email and a wrong password share one code.

    ```json
    { "code": "auth.invalid_credentials", "message": "Invalid credentials" }
    ```

    **422 Unprocessable Entity** — `user.email.invalid`.

    ## GET /auth/me

    `GET {{BASE_URL}}/{{BASE_PATH}}/auth/me`

    Cookie: `accessToken=<jwt>`.

    **200 OK**

    ```json
    {
      "id": "019a1ad3-2066-7374-aba6-81baa99bba4a",
      "username": "jane_doe",
      "email": "jane.doe@example.com",
      "avatar_key": null,
      "avatar_placeholder": null,
      "createdAt": "2026-05-18T09:30:00.000Z",
      "updatedAt": null
    }
    ```

    **401 Unauthorized** — the access cookie is missing or the JWT middleware did not accept it.

    ```json
    { "message": "Unauthorized" }
    ```

    **404 Not Found** — the token subject is not a user.

    ```json
    { "code": "user.not_found", "message": "User not found" }
    ```

    **422 Unprocessable Entity** — the token subject is not a valid id.

    ```json
    { "code": "id.invalid", "message": "Invalid UUID" }
    ```

    ## POST /auth/logout

    `POST {{BASE_URL}}/{{BASE_PATH}}/auth/logout`

    Cookie: `refreshToken=<secret>`. The response clears `accessToken` and `refreshToken`.

    **200 OK**

    ```json
    { "message": "User logged out successfully" }
    ```

    **401 Unauthorized** — the refresh token is not an active session.

    ```json
    { "code": "auth.refresh_token.invalid", "message": "Invalid refresh token" }
    ```

    **422 Unprocessable Entity** — the cookie value is not a refresh-token secret.

    ```json
    { "code": "auth.refresh_token.secret_invalid", "message": "Invalid refresh token secret" }
    ```
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    openapi:
      - sourceUrl: http://localhost:3000/api/v1/docs
        groupBy: tags
        autoCheck: true
        autoCheckInterval: 5
