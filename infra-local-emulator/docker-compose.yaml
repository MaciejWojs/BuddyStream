name: infra-local-emulator

services:
  floci:
    image: floci/floci:2.5.0
    ports:
      - '4566:4566'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
