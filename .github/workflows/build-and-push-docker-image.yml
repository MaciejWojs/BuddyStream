name: Publish buddy-stream-backend Docker image to GHCR

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE_NAME: buddy-stream-backend

jobs:
  verify:
    uses: ./.github/workflows/check.yaml
  push:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image_url: ${{ steps.set_var.outputs.image_url }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            runnumber=${{ github.run_id }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set image URL
        id: set_var
        run: |
          TAG=${GITHUB_REF_NAME#v}
          echo "image_url=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:$TAG" | tr [:upper:] [:lower:] >> $GITHUB_OUTPUT
  make-pr-locally:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - uses: actions/checkout@v7
      - name: Create branch
        run: |
          BRANCH="image-bump-backend-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git switch -c "$BRANCH"

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install yq (YAML processor)
        run: |
          sudo snap install yq

      - name: Update image version in docker-compose.yaml
        shell: bash
        env:
          VERSION: ${{ needs.push.outputs.image_url }}
        run: |
          export TAG="${VERSION##*:}"
          yq eval-all -i '.services.backend.image = env(TAG)' docker-compose.yaml
      - name: Commit and push changes
        run: |
          git add .
          git commit -m "chore: Update backend image to ${{ needs.push.outputs.image_url }}"
          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo ${{ github.repository }} \
            --base main \
            --head "$BRANCH" \
            --title "chore: bump backend image to ${{ needs.push.outputs.image_url }}" \
            --body "Automated backend image bump from ${{ github.repository }} run $GITHUB_RUN_ID"
