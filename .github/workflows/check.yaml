on:
  workflow_call:
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to check
        required: true
        default: main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: format check
        run: bun fmt --check

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun typecheck

      - name: Audit
        run: bun audit
